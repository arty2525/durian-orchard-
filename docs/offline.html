<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#294d38"><title>ออฟไลน์ · สวนทุเรียน</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f6ef;color:#294d38;font:17px/1.8 system-ui,sans-serif}main{max-width:420px;padding:32px}img{width:80px;border-radius:20px}h1{font-size:28px}a{display:inline-block;padding:12px 20px;background:#294d38;color:white;border-radius:12px;text-decoration:none}p{color:#586554}</style><main><img src="./icons/orchard-192.png" alt=""><h1>ยังเชื่อมต่อสวนไม่ได้</h1><p>กรุณาเชื่อมต่ออินเทอร์เน็ต แล้วเปิดแอปอีกครั้งเพื่ออ่านข้อมูลล่าสุดและสั่งรดน้ำ</p><p>สถานะปั๊มและวาล์วอาจเปลี่ยนระหว่างออฟไลน์ หน้านี้ไม่ส่งหรือเก็บคิวคำสั่งเปิด–ปิดน้ำ</p><a href="./">ลองเชื่อมต่ออีกครั้ง</a></main></html>
